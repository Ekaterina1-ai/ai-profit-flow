    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07090f;
            --cyan: #22d3ee;
            --line: rgba(34, 211, 238, 0.12);
        }
        body {
            font-family: 'Manrope', sans-serif;
            background-color: var(--bg);
            color: white;
            overflow-x: hidden;
        }
        .font-heading {
            font-family: 'Syne', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .price-glow:hover {
            text-shadow: 0 0 20px #29DDDA;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; filter: brightness(1.2); }
            50% { opacity: 0.8; filter: brightness(1); }
        }
        
        @keyframes icon-pulse-color {
            0%, 100% { color: #22d3ee; filter: drop-shadow(0 0 5px #22d3ee); opacity: 1; }
            33% { color: #3b82f6; filter: drop-shadow(0 0 8px #3b82f6); opacity: 0.7; }
            66% { color: #67e8f9; filter: drop-shadow(0 0 5px #67e8f9); opacity: 1; }
        }
        .animate-ai-icon {
            animation: icon-pulse-color 3s infinite ease-in-out;
        }

        @keyframes marquee-right {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-slow-marquee {
            display: flex;
            width: max-content;
            animation: marquee-right 60s linear infinite;
        }
        .animate-slow-marquee:hover {
            animation-play-state: paused;
        }

        .solutions-marquee {
            overflow: hidden;
        }
        .solutions-marquee:hover .solutions-marquee-track {
            animation-play-state: paused;
        }
        .solutions-marquee-track {
            display: flex;
            flex-wrap: nowrap;
            width: max-content;
            will-change: transform;
            animation: marquee-right 35s linear infinite;
        }

        /* Hero tech atmosphere */
        .hero-stage {
            position: relative;
            isolation: isolate;
            min-height: min(92vh, 920px);
            display: flex;
            align-items: center;
            background:
                radial-gradient(ellipse 70% 55% at 50% 35%, rgba(8, 47, 73, 0.55), transparent 70%),
                radial-gradient(ellipse 45% 40% at 85% 15%, rgba(14, 116, 144, 0.22), transparent 60%),
                radial-gradient(ellipse 40% 35% at 10% 80%, rgba(30, 58, 138, 0.18), transparent 55%),
                #07090f;
        }
        .hero-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(90deg, var(--line) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(ellipse 75% 65% at 50% 40%, black 20%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse 75% 65% at 50% 40%, black 20%, transparent 75%);
            animation: grid-awaken 1.4s ease-out both, grid-drift 48s linear 1.4s infinite;
            opacity: 0.45;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes grid-awaken {
            from { opacity: 0; background-size: 80px 80px; }
            to { opacity: 0.45; background-size: 64px 64px; }
        }
        @keyframes grid-drift {
            0% { background-position: 0 0, 0 0; }
            100% { background-position: 64px 64px, 64px 64px; }
        }
        .hero-scan {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                180deg,
                transparent 0%,
                rgba(34, 211, 238, 0.035) 49%,
                transparent 51%,
                transparent 100%
            );
            background-size: 100% 280%;
            animation: scan-rare 14s ease-in-out 2s infinite;
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
            opacity: 0;
        }
        @keyframes scan-rare {
            0%, 78%, 100% { background-position: 0% -20%; opacity: 0; }
            82% { opacity: 0.45; }
            90% { background-position: 0% 120%; opacity: 0.15; }
            94%, 100% { opacity: 0; }
        }
        .hero-orbit {
            position: absolute;
            left: 50%;
            top: 42%;
            width: min(920px, 92vw);
            height: min(920px, 92vw);
            transform: translate(-50%, -50%) scale(0.92);
            border: 1px solid rgba(34, 211, 238, 0.08);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: orbit-awaken 1.6s ease-out 0.2s both;
        }
        .hero-orbit::before,
        .hero-orbit::after {
            content: '';
            position: absolute;
            inset: 12%;
            border-radius: 50%;
            border: 1px dashed rgba(34, 211, 238, 0.12);
            animation: orbit-spin 72s linear 1.8s infinite;
            opacity: 0.85;
        }
        .hero-orbit::after {
            inset: 24%;
            border-style: solid;
            border-color: rgba(59, 130, 246, 0.1);
            animation-duration: 96s;
            animation-direction: reverse;
        }
        @keyframes orbit-awaken {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.88); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes orbit-spin {
            to { transform: rotate(360deg); }
        }

        .hero-mesh {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }
        .hero-mesh-line {
            fill: none;
            stroke: url(#heroWire);
            stroke-width: 1.15;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1400;
            stroke-dashoffset: 1400;
            animation: mesh-draw 1.55s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .hero-mesh-line:nth-child(1) { animation-delay: 0.15s; }
        .hero-mesh-line:nth-child(2) { animation-delay: 0.35s; }
        .hero-mesh-line:nth-child(3) { animation-delay: 0.55s; }
        @keyframes mesh-draw {
            to { stroke-dashoffset: 0; }
        }
        .hero-mesh-node {
            fill: #22d3ee;
            opacity: 0;
            transform-origin: center;
            transform-box: fill-box;
            animation: node-awaken 0.55s ease-out forwards;
        }
        .hero-mesh-node.is-alive {
            animation:
                node-awaken 0.55s ease-out forwards,
                node-idle 5.5s ease-in-out 2s infinite;
        }
        @keyframes node-awaken {
            0% { opacity: 0; transform: scale(0.2); }
            70% { opacity: 0.95; transform: scale(1.25); }
            100% { opacity: 0.55; transform: scale(1); }
        }
        @keyframes node-idle {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.75; }
        }
        .hero-pulse-packet {
            fill: #67e8f9;
            opacity: 0;
            offset-path: path('M80 180 L260 240 L420 120 L610 210 L780 140 L980 230 L1120 160');
            offset-distance: 0%;
            animation: packet-travel 9s ease-in-out 2.2s infinite;
        }
        .hero-pulse-packet.alt {
            offset-path: path('M120 520 L300 430 L480 510 L670 390 L860 470 L1040 400');
            animation-delay: 5.5s;
            animation-duration: 11s;
        }
        @keyframes packet-travel {
            0%, 8% { opacity: 0; offset-distance: 0%; }
            14% { opacity: 0.9; }
            55% { opacity: 0.55; }
            70% { opacity: 0; offset-distance: 100%; }
            100% { opacity: 0; offset-distance: 100%; }
        }

        .hero-fade-up {
            animation: hero-fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .hero-fade-up-delay-1 { animation-delay: 0.12s; }
        .hero-fade-up-delay-2 { animation-delay: 0.24s; }
        .hero-fade-up-delay-3 { animation-delay: 0.36s; }
        .hero-fade-up-delay-4 { animation-delay: 0.48s; }
        @keyframes hero-fade-up {
            from { opacity: 0; transform: translateY(22px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-status {
            font-family: 'Manrope', sans-serif;
            letter-spacing: 0.22em;
        }
        .hero-status-dot {
            width: 7px;
            height: 7px;
            border-radius: 999px;
            background: #34d399;
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.55);
            animation: status-pulse 2.2s ease-out infinite;
        }
        @keyframes status-pulse {
            0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(52, 211, 153, 0); }
            100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
        }
        .hero-title-shine {
            background-size: 200% auto;
            animation: title-shine 6s ease-in-out infinite;
        }
        @keyframes title-shine {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 100% center; }
        }

        @media (prefers-reduced-motion: reduce) {
            .solutions-marquee-track,
            .hero-grid,
            .hero-scan,
            .hero-orbit,
            .hero-orbit::before,
            .hero-orbit::after,
            .hero-mesh-line,
            .hero-mesh-node,
            .hero-pulse-packet,
            .hero-fade-up,
            .hero-title-shine,
            .hero-status-dot {
                animation: none !important;
            }
            .solutions-marquee-track {
                transform: none !important;
            }
            .hero-fade-up,
            .hero-grid,
            .hero-orbit,
            .hero-mesh-node {
                opacity: 1;
                transform: none;
            }
            .hero-mesh-line {
                stroke-dashoffset: 0;
            }
            .hero-pulse-packet {
                display: none;
            }
        }
        
        .modal-backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
        }
        
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
